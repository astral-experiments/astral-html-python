[package]
name = "astral-html-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A Rust-backed HTML parser and CSS selector engine for Python"
license = "MIT OR Apache-2.0"
repository = "https://github.com/astral-experiments/astral-html-python"
publish = false
# Maturin uses Cargo's package file list when building the Python source archive.
include = [
    "/Cargo.lock",
    "/LICENSE-*",
    "/README.md",
    "/benchmarks/filtered-links*.png",
    "/pyproject.toml",
    "/python/astral_html/*.py",
    "/python/astral_html/*.pyi",
    "/python/astral_html/py.typed",
    "/src/**/*.rs",
]

[lib]
name = "_astral_html"
crate-type = ["cdylib"]

[dependencies]
astral-html = "=0.0.3"
pyo3 = "0.29"
selectors = "0.41"
cssparser = "0.38"
precomputed-hash = "0.1"
stacker = "0.1.25"

[profile.release]
lto = "thin"
codegen-units = 1
