[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "astral-html-python"
dynamic = ["version"]
description = "A Rust-backed HTML parser and CSS selector engine for Python"
requires-python = ">=3.14,<3.16"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

readme = "README.md"

[project.urls]
Documentation = "https://github.com/astral-experiments/astral-html-python/blob/main/docs/parsing.md"
Source = "https://github.com/astral-experiments/astral-html-python"
Issues = "https://github.com/astral-experiments/astral-html-python/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "ty>=0.0.1"]
benchmark = ["selectolax>=0.4", "lxml>=5", "cssselect>=1.2", "beautifulsoup4>=4.12"]

[tool.maturin]
python-source = "python"
module-name = "astral_html._astral_html"
locked = true

[tool.uv]
exclude-newer = "7 days"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

