[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "astral-html-python"
version = "0.0.1"
description = "A Rust-backed HTML parser and CSS selector engine for Python"
requires-python = ">=3.14,<3.16"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.readme]
content-type = "text/markdown"
text = """
This project is an experiment in developing a library using Codex. The content below the line, as well as all the code, are written by Codex.

---

astral-html-python is a fast HTML parser for Python web scrapers. It uses the
[astral-html](https://github.com/astral-sh/astral-html) tokenizer and a Rust
tree to find elements by CSS selector and extract their text and attributes.

[Quick start](https://github.com/astral-experiments/astral-html-python#quick-start) ·
[Benchmark plot](https://github.com/astral-experiments/astral-html-python/blob/main/benchmarks/filtered-links.png) ·
[Benchmark results](https://github.com/astral-experiments/astral-html-python/blob/main/benchmarks/README.md)
"""

[project.urls]
Documentation = "https://github.com/astral-experiments/astral-html-python/blob/main/docs/parsing.md"
Source = "https://github.com/astral-experiments/astral-html-python"
Issues = "https://github.com/astral-experiments/astral-html-python/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "ty>=0.0.1"]
benchmark = ["selectolax>=0.4", "lxml>=5", "cssselect>=1.2", "beautifulsoup4>=4.12"]

[tool.maturin]
python-source = "python"
module-name = "astral_html._astral_html"
locked = true

[tool.uv]
exclude-newer = "7 days"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

