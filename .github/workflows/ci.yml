name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.14'
            rust: '1.97.0'
          - python: '3.15'
            rust: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install locked test and benchmark dependencies
        run: uv sync --locked --no-install-project --group benchmark --python ${{ matrix.python }}
      - name: Build a source distribution, then a wheel from that archive
        run: >-
          uv build --no-sources --out-dir "$RUNNER_TEMP/dist" --python ${{ matrix.python }}
          --config-setting 'build-args=--compatibility pypi --auditwheel check'
      - name: Test the installed wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps --strict "$RUNNER_TEMP"/dist/*.whl
          uv run --no-sync python -I -m pytest --import-mode=importlib
          uv run --no-sync python -I benchmarks/run.py --check
          uv run --no-sync python -I benchmarks/run.py --fixture pypi --samples 2 --min-sample-ms 1
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
