name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # Explicit installs use the Python archive hashes embedded in the pinned uv binary.
  UV_PYTHON_DOWNLOADS: manual
  UV_MANAGED_PYTHON: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.6'
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          # A restored dependency cache can bypass archive verification on a fresh runner.
          enable-cache: false
      - run: uv python install 3.14.10
      - run: bash .github/install-rust.sh 1.97.0
      # Build abi3 once so both interpreters exercise the same binary.
      - name: Build the source distribution and stable ABI wheel
        env:
          UV_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt
          UV_REQUIRE_HASHES: 'true'
        run: |
          dist="$RUNNER_TEMP/dist"
          bash .github/prepare-pypi-readme.sh
          uv build --sdist --no-sources --out-dir "$dist" --python 3.14
          uv build "$dist"/*.tar.gz --wheel --no-sources --out-dir "$dist" --python 3.14 \
            --config-setting 'build-args=--compatibility pypi --auditwheel check --features abi3'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist-and-abi3
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          overwrite: true

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.14.10'
            rust: '1.97.0'
          - python: '3.15.1'
            rust: '1.99.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.6'
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          enable-cache: false
      - run: uv python install ${{ matrix.python }}
      - run: bash .github/install-rust.sh ${{ matrix.rust }}
      - name: Install locked test dependencies
        run: uv sync --locked --no-build --no-install-project --python ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist-and-abi3
          path: ${{ runner.temp }}/dist
      - name: Build a native wheel from the source distribution
        # Exercise selector limits with abort in the native wheels and the default strategy in abi3.
        env:
          CARGO_PROFILE_RELEASE_PANIC: abort
          UV_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt
          UV_REQUIRE_HASHES: 'true'
        run: >-
          uv build "$RUNNER_TEMP"/dist/*.tar.gz --wheel --no-sources
          --out-dir "$RUNNER_TEMP/dist" --python .venv/bin/python
          --config-setting 'build-args=--compatibility pypi --auditwheel check'
      # Both wheels have the same version. Force each install and keep uv from
      # syncing the editable project back into the test environment.
      - name: Test the native and stable ABI wheels
        run: |
          dist="$RUNNER_TEMP/dist"
          cp=$(.venv/bin/python -c 'import sys; print("cp%d%d" % sys.version_info[:2])')
          for tag in "$cp-$cp" cp314-abi3; do
            uv pip install --python .venv/bin/python --no-deps --strict --reinstall "$dist"/*-"$tag"-*.whl
            uv run --no-sync python -I -m pytest --import-mode=importlib
          done

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.14.10'
            rust: '1.97.0'
          - python: '3.15.1'
            rust: '1.99.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.6'
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          enable-cache: false
      - run: uv python install ${{ matrix.python }}
      - run: bash .github/install-rust.sh ${{ matrix.rust }}
      - name: Install locked lint dependencies
        run: uv sync --locked --no-build --no-install-project --group benchmark --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.6'
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          enable-cache: false
      - run: uv python install 3.14.10
      - name: Install the locked zizmor wheel
        run: uv sync --locked --only-group zizmor --no-build --python 3.14.10
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/zizmor --strict-collection --collect=workflows,actions .
