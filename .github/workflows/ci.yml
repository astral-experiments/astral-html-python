name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - run: uv sync --locked --group benchmark --python ${{ matrix.python }}
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python benchmarks/run.py --fixture pypi --samples 2 --min-sample-ms 1
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: uv build --no-sources --python ${{ matrix.python }}
      - run: uv run --no-project --with dist/*.whl --python ${{ matrix.python }} python -I -c "from astral_html import parse; assert parse('<a href=x>link</a>').select_one('a[href]').text == 'link'"
