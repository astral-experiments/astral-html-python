name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
      - uses: &setup-python-action actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: &rust-toolchain dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.97.0'
      - name: Build the source distribution and stable ABI wheel
        run: |
          dist="$RUNNER_TEMP/dist"
          uv build --sdist --no-sources --out-dir "$dist" --python 3.14
          uv build "$dist"/*.tar.gz --wheel --no-sources --out-dir "$dist" --python 3.14 \
            --config-setting 'build-args=--compatibility pypi --auditwheel check --features abi3'
          python scripts/check_notices.py "$dist"/*.tar.gz "$dist"/*-cp314-abi3-*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist-and-abi3
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          overwrite: true

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy: &toolchains
      matrix:
        include:
          - python: '3.14'
            rust: '1.97.0'
          - python: '3.15'
            rust: stable
    steps:
      - *checkout
      - *setup-uv
      - &setup-python
        uses: *setup-python-action
        with:
          python-version: ${{ matrix.python }}
      - uses: *rust-toolchain
        with:
          toolchain: ${{ matrix.rust }}
      - &install-dependencies
        name: Install locked test and benchmark dependencies
        run: uv sync --locked --no-install-project --group benchmark --python ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist-and-abi3
          path: ${{ runner.temp }}/dist
      - name: Build a native wheel from the source distribution
        run: >-
          uv build "$RUNNER_TEMP"/dist/*.tar.gz --wheel --no-sources
          --out-dir "$RUNNER_TEMP/dist" --python .venv/bin/python
          --config-setting 'build-args=--compatibility pypi --auditwheel check'
      - name: Test the native and stable ABI wheels
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          dist="$RUNNER_TEMP/dist"
          cp="cp${PYTHON_VERSION//./}"
          python scripts/check_notices.py "$dist"/*-"$cp-$cp"-*.whl
          for tag in "$cp-$cp" cp314-abi3; do
            uv pip install --python .venv/bin/python --no-deps --strict --reinstall "$dist"/*-"$tag"-*.whl
            uv run --no-sync python -I -m pytest --import-mode=importlib
            uv run --no-sync python -I benchmarks/run.py --check
            uv run --no-sync python -I benchmarks/run.py --fixture pypi --samples 2 --min-sample-ms 1
          done

  lint:
    runs-on: ubuntu-latest
    strategy: *toolchains
    steps:
      - *checkout
      - *setup-uv
      - *setup-python
      - uses: *rust-toolchain
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - *install-dependencies
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
