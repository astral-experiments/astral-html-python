name: Start release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from main, without the leading v
        required: true
        type: string

permissions:
  contents: read

env:
  # Explicit installs use the Python archive hashes embedded in the pinned uv binary.
  UV_PYTHON_DOWNLOADS: manual
  UV_MANAGED_PYTHON: 'true'

jobs:
  ci:
    if: github.repository == 'astral-experiments/astral-html-python' && github.ref == 'refs/heads/main'
    uses: $/.github/workflows/ci.yml

  prepare:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist-and-abi3
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.6'
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          enable-cache: false
      - run: uv python install 3.14.10
      - name: Select the tested sdist and its changelog entry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sdists=(dist/*.tar.gz)
          if [[ ${#sdists[@]} != 1 || ${sdists[0]} != "dist/astral_html-$VERSION.tar.gz" ]]; then
            echo "::error::Requested version $VERSION does not match the built sdist"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            test "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$GITHUB_SHA"
          fi
          mkdir release
          awk -v heading="## $VERSION" '
            /^## / { selected = ($0 == heading); next }
            selected { print }
          ' CHANGELOG.md > release/notes.md
          if ! grep -q '[^[:space:]]' release/notes.md; then
            echo "::error::Missing changelog entry for $VERSION"
            exit 1
          fi
          mv "${sdists[0]}" release/
          printf 'v%s\n' "$VERSION" > release/tag
          uv run --locked --no-build --only-group dev --python 3.14.10 python - <<'PY' > release/prerelease
          import os
          from packaging.version import Version

          print(str(Version(os.environ["VERSION"]).is_prerelease).lower())
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # A rerun may rebuild the sdist. Bind publication to this attempt's bytes.
          name: release-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
