name: Publish release

on:
  # The pypi job checks the dispatch, run identity, and main ancestry before consuming the artifact.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Start release]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  pypi:
    # workflow_run has publishing privileges. Only consume a successful manual run in this repository.
    if: >-
      github.repository == 'astral-experiments/astral-html-python' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/start-release.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/astral-html/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Verify the source commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        # workflow_run reports a short branch name, which a same-named tag could also have.
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...$main_sha" --jq .status | grep -Ex 'ahead|identical'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.event.workflow_run.run_attempt }}
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.6'
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          enable-cache: false
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple release/*.tar.gz

  github:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's GITHUB_SHA can be newer than the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.event.workflow_run.run_attempt }}
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Tag the published commit and release its changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat release/tag)
          gh auth setup-git
          git push origin "HEAD:refs/tags/$tag"
          if gh release view "$tag" --json isDraft --jq '.isDraft == false' | grep -qx true; then
            exit 0
          fi
          gh release create "$tag" --verify-tag --title "$tag" --notes-file release/notes.md \
            --prerelease="$(cat release/prerelease)"
